[package]
name = "auditnote"
version = "1.0.0"
description = "AuditNote — 轻量的本地 Markdown 阅读与编辑工具"
authors = ["Hejunlong27"]
license = "MIT"
edition = "2021"
rust-version = "1.77"

[lib]
name = "auditnote_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
tauri-plugin-single-instance = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.32", features = ["bundled"] }
base64 = "0.22"
walkdir = "2"

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true

[features]
# 默认使用 Tauri 自定义协议（生产模式）
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]
